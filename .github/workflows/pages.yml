name: Publish Godot Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Install Godot and its Web template
        shell: bash
        run: |
          set -euo pipefail
          version=4.7.2
          build_dir="$RUNNER_TEMP/godot"
          mkdir -p "$build_dir"
          curl --fail --location --retry 3 \
            "https://godot-releases.nbg1.your-objectstorage.com/${version}-stable/Godot_v${version}-stable_linux.x86_64.zip" \
            --output "$build_dir/godot.zip"
          unzip -q "$build_dir/godot.zip" -d "$build_dir"
          chmod +x "$build_dir/Godot_v${version}-stable_linux.x86_64"
          python3 tools/install_web_templates.py "${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/${version}.stable"
      - name: Export Godot Web
        run: python3 tools/export_web.py --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --output "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
