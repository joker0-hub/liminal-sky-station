<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>$GODOT_PROJECT_NAME</title>
	$GODOT_HEAD_INCLUDE
	<style>
		@font-face {
			font-family: StationTitle;
			src: url('./liminal-title.ttf') format('truetype');
			font-display: swap;
		}
		:root {
			color-scheme: dark;
			background: #101d2e;
			color: #fff5e7;
			--brass: #f2cd9e;
		}
		body { margin: 0; overflow: hidden; font: 15px/1.5 system-ui, sans-serif; }
		#canvas { display: block; width: 100vw; height: 100dvh; outline: none; touch-action: none; }
		#status, .opening-view { position: fixed; inset: 0; }
		.opening-view { width: 100%; height: 100%; object-fit: cover; background: #183862; }
		.opening-copy {
			position: absolute;
			inset-inline: clamp(22px, 6vw, 155px) 22px;
			bottom: clamp(24px, 9.5dvh, 120px);
			display: grid; justify-items: start; gap: clamp(6px, 1dvh, 12px);
			text-shadow: 0 1px 5px #101926, 0 2px 18px #101926;
		}
		[hidden] { display: none; }
		.brand {
			display: flex; align-items: center; gap: 9px; color: var(--brass);
			font-size: clamp(11px, 1.1vw, 16px); letter-spacing: 0.24em;
		}
		.brand img { width: 26px; height: 26px; }
		h1 { margin: 0; font: clamp(44px, 7dvh, 84px)/1.12 StationTitle, KaiTi, serif; }
		.loading-state { min-height: 50px; }
		.loading-label { display: flex; justify-content: space-between; gap: 12px; }
		progress { display: block; width: min(230px, 74vw); height: 6px; margin-top: 8px; accent-color: var(--brass); }
		p { margin: 0; }
		button {
			min-height: 46px; padding: 8px 22px; border: 1px solid var(--brass); border-radius: 8px;
			background: var(--brass); color: #17283a; font: 600 16px/1.5 system-ui, sans-serif; cursor: pointer;
		}
		button:hover { background: #ffe2bd; }
		button:focus-visible { outline: 2px solid #fff0cc; outline-offset: 3px; }
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="-1" aria-label="天空车站实时场景" inert></canvas>
	<main id="status">
		<img class="opening-view" src="./station-opening.webp" alt="" fetchpriority="high">
		<section class="opening-copy" aria-labelledby="status-title">
			<p class="brand"><img src="$GODOT_SPLASH" alt="">LIMINAL SKY STATION</p>
			<h1 id="status-title">天空车站</h1>
			<div class="loading-state" id="loading-state">
				<div class="loading-label">
					<p id="loading" role="status">正在加载车站</p>
					<span id="percent" aria-hidden="true"></span>
				</div>
				<progress max="1" aria-label="车站资源加载进度"></progress>
			</div>
			<button id="enter" type="button" hidden>进入车站</button>
			<p id="status-notice" role="alert" hidden></p>
			<button id="retry" type="button" hidden>重新加载</button>
			<noscript>请启用 JavaScript 进入车站。</noscript>
		</section>
	</main>
	<script src="$GODOT_URL"></script>
	<script>
		const canvas = document.querySelector('#canvas');
		const status = document.querySelector('#status');
		const poster = status.querySelector('.opening-view');
		const loadingState = status.querySelector('#loading-state');
		const progress = status.querySelector('progress');
		const loading = status.querySelector('#loading');
		const percent = status.querySelector('#percent');
		const notice = status.querySelector('#status-notice');
		const enter = status.querySelector('#enter');
		const retry = status.querySelector('#retry');
		let enterStation;
		let preparing = false;

		// Keep display aspect and cap the backing buffer at 2560 × 1440.
		function sizeCanvas() {
			const { width, height } = canvas.getBoundingClientRect();
			if (!width || !height) return;
			const ratio = Math.min(devicePixelRatio, 2560 / width, 1440 / height);
			const w = Math.max(1, Math.round(width * ratio));
			const h = Math.max(1, Math.round(height * ratio));
			if (canvas.width !== w) canvas.width = w;
			if (canvas.height !== h) canvas.height = h;
		}
		sizeCanvas();
		new ResizeObserver(sizeCanvas).observe(canvas);
		window.addEventListener('resize', sizeCanvas);

		const settings = new URLSearchParams(location.search);
		window.stationNativeResolution = settings.get('quality') === '2k';
		if (settings.has('stats')) window.liminalRender = {};

		// Measure the display while downloading the engine and resource pack.
		window.stationDisplayHz = 60;
		{
			const intervals = [];
			let previous = 0;
			function measure(timestamp) {
				if (previous && timestamp > previous) intervals.push(timestamp - previous);
				previous = timestamp;
				if (intervals.length < 18) {
					requestAnimationFrame(measure);
				} else {
					intervals.sort((a, b) => a - b);
					window.stationDisplayHz = 1000 / intervals[4];
				}
			}
			requestAnimationFrame(measure);
		}

		function fail(message, detail) {
			if (detail) console.error(detail);
			status.hidden = false;
			poster.hidden = false;
			loadingState.hidden = true;
			enter.hidden = true;
			canvas.inert = true;
			notice.textContent = message;
			notice.hidden = false;
			retry.hidden = false;
			retry.focus();
		}
		window.stationOpeningFailed = () => fail('车站场景加载失败，请重新加载。');
		window.stationOpeningReady = callback => {
			if (!notice.hidden) return;
			enterStation = callback;
			poster.hidden = true;
			loadingState.hidden = true;
			enter.hidden = false;
			if (document.activeElement === document.body) enter.focus({ preventScroll: true });
		};
		enter.addEventListener('click', () => {
			if (!enterStation) return;
			status.hidden = true;
			canvas.inert = false;
			canvas.focus({ preventScroll: true });
			enterStation();
			enterStation = null;
		});
		retry.addEventListener('click', () => location.reload());
		canvas.addEventListener('webglcontextlost', event => {
			event.preventDefault();
			// Use the reload panel in place of the engine's blocking alert.
			event.stopImmediatePropagation();
			document.exitPointerLock?.();
			fail('图形连接已中断，请重新加载车站。');
		});

		const missing = typeof Engine === 'undefined'
			? ['Godot loader unavailable']
			: Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
		if (missing.length) {
			const message = typeof Engine === 'undefined'
				? '车站加载失败，请重新加载。'
				: '当前浏览器无法运行车站，请确认已启用 WebGL 2。';
			fail(message, missing.join('\n'));
		} else {
			const config = $GODOT_CONFIG;
			const pack = config.mainPack || `${config.executable}.pck`;
			const engine = new Engine({
				...config,
				canvas,
				focusCanvas: false,
				onProgress(current, total) {
					if (preparing || loadingState.hidden || total <= 0) return;
					progress.value = Math.min(1, current / total);
					percent.textContent = `${Math.floor(progress.value * 100)}%`;
				},
				onExit() { fail('车站已停止运行，请重新加载。'); },
			});
			Promise.all([
				Engine.load(config.executable, config.fileSizes[`${config.executable}.wasm`]),
				engine.init(config.executable),
				engine.preloadFile(pack, pack),
			]).then(() => {
				preparing = true;
				loading.textContent = '正在准备场景';
				progress.removeAttribute('value');
				percent.textContent = '';
				// Paint the preparation state before Godot starts compiling WebGL shaders.
				return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
			}).then(() => engine.start({args: ['--main-pack', pack, ...config.args]}))
				.catch(error => fail('车站加载失败，请重新加载。', error));
		}
	</script>
</body>
</html>
